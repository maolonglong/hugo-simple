<nav class="pagination flex-between" aria-label="{{ T "pagination" }}">
  {{ with .Paginator }}
    {{ if .HasPrev }}
      <a href="{{ .Prev.URL }}" rel="prev">
        <span aria-hidden="true">←</span>
        <span>{{ T "prev_page" }}</span>
      </a>
    {{ end }}
    {{ if .HasNext }}
      <a href="{{ .Next.URL }}" rel="next">
        <span>{{ T "next_page" }}</span>
        <span aria-hidden="true">→</span>
      </a>
    {{ end }}
  {{ end }}
</nav>
